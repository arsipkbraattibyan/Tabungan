<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabungan Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14211b;--mut:#6b7a72;--line:#e6ede9;--soft:#f5f8f6;--hijau:#0f8a5f;--tua:#0b5c42;--merah:#e53935;--kuning:#fbc02d;--biru:#2196f3}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:24px 18px 56px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--biru);outline-offset:2px}
.hide{display:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.brand img{width:46px;height:46px;object-fit:contain}
.brand b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:.85rem}
h1{font-size:1.9rem;line-height:1.15;letter-spacing:-.02em;font-weight:800;margin:0 0 6px}
h2{font-size:1rem;font-weight:800;margin:28px 0 10px}
.role{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px;text-align:left;color:var(--ink);transition:transform .12s,border-color .12s}
.role:hover{border-color:#c9d6cf}.role:active{transform:scale(.985)}
.ikon{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem}
.role b{display:block;font-weight:800}.role .sub{display:block}
.role i{margin-left:auto;font-style:normal;color:var(--mut);font-size:1.4rem}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:28px;font-size:.8rem;color:var(--mut)}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#b8c4bd}
.status.ok:before{background:var(--hijau)}.status.gagal:before{background:var(--merah)}
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:var(--hijau);color:#fff;font-weight:800;font-size:1rem}
.btn:disabled{opacity:.6}
.ghost{width:auto;margin:0;padding:8px 14px;background:var(--soft);color:var(--ink);font-weight:600;font-size:.85rem;border-radius:999px}
.pesan{margin:12px 0 0;font-weight:600;font-size:.9rem}.err{color:var(--merah)}.ok{color:var(--hijau)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.kartu{background:var(--tua);color:#fff;border-radius:22px;padding:22px}
.kartu .sub{color:#b9e3d1}.kartu strong{display:block;font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:4px 0}
.box{border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.pad{padding:8px 16px 18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row b{display:block;font-weight:600}
.ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.masuk{background:#e3f6ec;color:var(--hijau)}.keluar{background:#fdeaea;color:var(--merah)}.nama{background:#e8f2fd;color:var(--biru)}
.plus{color:var(--hijau);font-weight:800}.min{color:var(--merah);font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:14px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="logo.png" alt="" onerror="this.remove()">
    <div><b>Tabungan Siswa</b><span class="sub">KB RA At Tibyan</span></div>
  </div>

  <section id="pilih">
    <h1>Selamat datang</h1>
    <p class="sub" style="margin:0 0 18px">Pilih peran untuk masuk.</p>
    <button class="role" data-peran="Guru"><span class="ikon" style="background:var(--biru)">🧑‍🏫</span><span><b>Guru</b><span class="sub">Catat setoran dan penarikan</span></span><i>›</i></button>
    <button class="role" data-peran="Kepala"><span class="ikon" style="background:var(--merah)">👨‍💼</span><span><b>Kepala Sekolah</b><span class="sub">Pantau seluruh tabungan</span></span><i>›</i></button>
    <button class="role" data-peran="Wali"><span class="ikon" style="background:var(--kuning)">👨‍👩‍👧</span><span><b>Wali Murid</b><span class="sub">Lihat saldo dan riwayat anak</span></span><i>›</i></button>
    <span class="status" id="status">Memeriksa server…</span>
  </section>

  <section id="masuk" class="hide">
    <button class="ghost" id="kembali">‹ Kembali</button>
    <h1 id="judul" style="margin-top:22px"></h1>
    <p class="sub" style="margin:0">Masukkan data akun Anda.</p>
    <label for="user" id="lUser"></label><input id="user" autocomplete="username">
    <label for="pass" id="lPass"></label><input id="pass" type="password" autocomplete="current-password">
    <p class="pesan err" id="errMasuk"></p>
    <button class="btn" id="kirim">Masuk</button>
  </section>

  <section id="app" class="hide"></section>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxNs7kqdTHZXHSUaJOvaoYnFVYzY_62XHMqiTmCCVB3ku9_dVCyagKi8LsNelFit5mt/exec';

const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, peran = '';
const NAMA = { Guru: 'Guru', Kepala: 'Kepala Sekolah', Wali: 'Wali Murid' };

async function call(body) {
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    return { ok: false, pesan: 'Tidak dapat terhubung ke server. Periksa URL Web App dan koneksi internet.' };
  }
}
fetch(API).then(r => r.json()).then(() => {
  $('#status').textContent = 'Server tersambung'; $('#status').className = 'status ok';
}).catch(() => {
  $('#status').textContent = 'Server tidak terhubung'; $('#status').className = 'status gagal';
});
function tampil(id) {
  ['pilih', 'masuk', 'app'].forEach(x => $('#' + x).classList.toggle('hide', x !== id));
}

document.querySelectorAll('[data-peran]').forEach(b => b.onclick = () => {
  peran = b.dataset.peran;
  const wali = peran === 'Wali';
  $('#judul').textContent = NAMA[peran];
  $('#lUser').textContent = wali ? 'Nama siswa' : 'Username';
  $('#lPass').textContent = wali ? 'PIN' : 'Kata sandi';
  $('#user').value = ''; $('#pass').value = ''; $('#errMasuk').textContent = '';
  tampil('masuk'); $('#user').focus();
});
$('#kembali').onclick = () => tampil('pilih');
$('#pass').onkeydown = e => { if (e.key === 'Enter') $('#kirim').click(); };

$('#kirim').onclick = async () => {
  $('#kirim').disabled = true; $('#errMasuk').className = 'pesan'; $('#errMasuk').textContent = 'Memeriksa…';
  const cred = { peran, user: $('#user').value, pass: $('#pass').value };
  const r = await call({ aksi: 'login', ...cred });
  $('#kirim').disabled = false;
  if (!r.ok) { $('#errMasuk').className = 'pesan err'; $('#errMasuk').textContent = r.pesan; return; }
  S = cred; muat();
};

function keluar() { S = null; tampil('pilih'); }

async function muat(pesan) {
  tampil('app'); $('#app').innerHTML = '<p class="sub">Memuat data…</p>';
  const r = await call({ aksi: 'data', ...S });
  if (!r.ok) { $('#app').innerHTML = '<p class="pesan err">' + esc(r.pesan) + '</p>'; return; }
  render(r, pesan);
}

function riwayat(tr, tampilNama) {
  if (!tr.length) return '<p class="sub">Belum ada transaksi.</p>';
  return '<div class="box">' + tr.map(t => {
    const masuk = t.Jenis === 'Setor';
    return `<div class="row"><span class="ava ${masuk ? 'masuk' : 'keluar'}">${masuk ? '↓' : '↑'}</span>
      <div class="t"><b>${esc(tampilNama ? t.Nama : t.Jenis)}</b><span class="sub">${esc(t.Waktu)}${t.Keterangan ? ' · ' + esc(t.Keterangan) : ''}</span></div>
      <span class="${masuk ? 'plus' : 'min'}">${masuk ? '+' : '−'}${rp(t.Jumlah)}</span></div>`;
  }).join('') + '</div>';
}

function render(d, pesan) {
  let h = `<div class="bar"><div><b>${esc(d.nama)}</b><div class="sub">${NAMA[d.peran]}${d.peran === 'Guru' && d.kelas ? ' · ' + esc(d.kelas) : ''}</div></div>
    <button class="btn ghost" id="keluar">Keluar</button></div>`;

  if (d.peran === 'Wali') {
    const s = d.siswa[0] || {};
    h += `<div class="kartu"><span class="sub">Saldo ${esc(s.Nama)}</span><strong>${rp(d.total)}</strong><span class="sub">${esc(s.Kelas)}</span></div>
      <h2>Riwayat</h2>${riwayat(d.transaksi, false)}`;
  } else {
    h += `<div class="kartu"><span class="sub">Total tabungan</span><strong>${rp(d.total)}</strong><span class="sub">${d.siswa.length} siswa</span></div>`;
    if (d.peran === 'Guru') {
      h += `<h2>Catat transaksi</h2><div class="box pad">
        <label for="fSiswa">Siswa</label><select id="fSiswa">${d.siswa.map(s => `<option value="${esc(s.Nama)}">${esc(s.Nama)}</option>`).join('')}</select>
        <label>Jenis</label><div class="seg"><button class="on" data-v="Setor">Setor</button><button data-v="Tarik">Tarik</button></div>
        <label for="fJumlah">Jumlah (Rp)</label><input id="fJumlah" type="number" min="1" inputmode="numeric">
        <label for="fKet">Keterangan</label><input id="fKet" placeholder="Opsional">
        <p class="pesan ${pesan && pesan.err ? 'err' : 'ok'}" id="fPesan">${esc(pesan ? pesan.teks : '')}</p>
        <button class="btn" id="fSimpan">Simpan transaksi</button></div>`;
    }
    h += `<h2>Saldo per siswa</h2><div class="box">${d.siswa.map(s => `
      <div class="row"><span class="ava nama">${esc(String(s.Nama).charAt(0).toUpperCase())}</span>
      <div class="t"><b>${esc(s.Nama)}</b><span class="sub">${esc(s.Kelas)}${s.PIN ? ' · PIN ' + esc(s.PIN) : ''}</span></div>
      <b>${rp(s.Saldo)}</b></div>`).join('')}</div>
      <h2>Transaksi terakhir</h2>${riwayat(d.transaksi, true)}`;
  }
  $('#app').innerHTML = h;
  $('#keluar').onclick = keluar;

  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  });
  if ($('#fSimpan')) $('#fSimpan').onclick = async () => {
    $('#fSimpan').disabled = true;
    const r = await call({ aksi: 'catat', ...S, nama: $('#fSiswa').value, jenis: $('.seg .on').dataset.v, jumlah: $('#fJumlah').value, ket: $('#fKet').value });
    if (r.ok) muat({ teks: 'Transaksi tersimpan' });
    else { $('#fSimpan').disabled = false; $('#fPesan').className = 'pesan err'; $('#fPesan').textContent = r.pesan; }
  };
}
</script>
</body>
</html>
