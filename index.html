<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabungan Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f4;--ink:#1d2b24;--mut:#5d6f65;--card:#fff;--line:#d9e3dc;--hijau:#2e7d4f;--merah:#e53935;--kuning:#fbc02d;--biru:#1e6fd9}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--ink:#e8f0eb;--mut:#9db0a5;--card:#1b2620;--line:#2b3a31}}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0}h2{font-size:1.1rem;margin:24px 0 10px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top img{width:48px;height:48px;object-fit:contain}
.sub{color:var(--mut);font-size:.9rem}
.menu{display:grid;gap:12px;margin-top:8px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:16px;font-size:1.05rem;cursor:pointer;color:#fff;text-align:left}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--biru);outline-offset:2px}
.kepala{background:var(--merah)}.wali{background:var(--kuning);color:#2a2200}.guru{background:var(--biru)}
.aksi{background:var(--hijau);text-align:center;padding:12px 18px}
.ghost{background:none;color:var(--mut);border:1px solid var(--line);padding:6px 12px;font-size:.85rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.saldo{font-size:2.4rem;font-weight:800;color:var(--hijau);line-height:1.1}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row b{display:block}.in{color:var(--hijau);font-weight:800}.out{color:var(--merah);font-weight:800}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.pesan{margin-top:12px;font-weight:700}.err{color:var(--merah)}.ok{color:var(--hijau)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-top:16px}summary{cursor:pointer;font-weight:800}
.hide{display:none}
</style>
</head>
<body>
<main>
  <div class="top">
    <img src="logo.png" alt="" onerror="this.remove()">
    <div><h1>Tabungan Siswa</h1><div class="sub">KB RA At Tibyan</div></div>
  </div>

  <section id="pilih">
    <div class="menu">
      <button class="btn kepala" data-peran="Kepala">Kepala Sekolah</button>
      <button class="btn wali" data-peran="Wali">Wali Murid</button>
      <button class="btn guru" data-peran="Guru">Guru</button>
    </div>
  </section>

  <section id="masuk" class="hide">
    <div class="card">
      <h2 id="judul" style="margin-top:0"></h2>
      <label for="user" id="lUser"></label><input id="user" autocomplete="username">
      <label for="pass" id="lPass"></label><input id="pass" type="password" autocomplete="current-password">
      <p class="pesan err" id="errMasuk"></p>
      <div class="cols">
        <button class="btn ghost" id="kembali">Kembali</button>
        <button class="btn aksi" id="kirim">Masuk</button>
      </div>
    </div>
  </section>

  <section id="app" class="hide"></section>
</main>

<script>
// Tempel URL Web App dari Google Apps Script (berakhiran /exec)
const API = 'https://script.google.com/macros/s/AKfycbxNs7kqdTHZXHSUaJOvaoYnFVYzY_62XHMqiTmCCVB3ku9_dVCyagKi8LsNelFit5mt/exec';

const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, peran = '';

async function call(body) {
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    return { ok: false, pesan: 'Tidak dapat terhubung ke server. Periksa URL Web App dan koneksi internet.' };
  }
}
function tampil(id) {
  ['pilih', 'masuk', 'app'].forEach(x => $('#' + x).classList.toggle('hide', x !== id));
}

document.querySelectorAll('[data-peran]').forEach(b => b.onclick = () => {
  peran = b.dataset.peran;
  const wali = peran === 'Wali';
  $('#judul').textContent = 'Masuk sebagai ' + (peran === 'Kepala' ? 'Kepala Sekolah' : wali ? 'Wali Murid' : 'Guru');
  $('#lUser').textContent = wali ? 'ID siswa' : 'Username';
  $('#lPass').textContent = wali ? 'PIN' : 'Kata sandi';
  $('#user').value = ''; $('#pass').value = ''; $('#errMasuk').textContent = '';
  tampil('masuk'); $('#user').focus();
});
$('#kembali').onclick = () => tampil('pilih');
$('#pass').onkeydown = e => { if (e.key === 'Enter') $('#kirim').click(); };

$('#kirim').onclick = async () => {
  $('#kirim').disabled = true; $('#errMasuk').textContent = 'Memeriksa…';
  const cred = { peran, user: $('#user').value, pass: $('#pass').value };
  const r = await call({ aksi: 'login', ...cred });
  $('#kirim').disabled = false;
  if (!r.ok) { $('#errMasuk').textContent = r.pesan; return; }
  S = cred; muat();
};

function keluar() { S = null; tampil('pilih'); }

async function muat(pesan) {
  tampil('app'); $('#app').innerHTML = '<p class="sub">Memuat data…</p>';
  const r = await call({ aksi: 'data', ...S });
  if (!r.ok) { $('#app').innerHTML = '<p class="pesan err">' + esc(r.pesan) + '</p>'; return; }
  render(r, pesan);
}

function riwayat(tr, tampilNama) {
  if (!tr.length) return '<p class="sub">Belum ada transaksi.</p>';
  return '<div class="card">' + tr.map(t => `
    <div class="row"><div><b>${esc(tampilNama ? t.Nama : t.Jenis)}</b>
      <span class="sub">${esc(t.Waktu)}${t.Keterangan ? ' · ' + esc(t.Keterangan) : ''}</span></div>
      <span class="${t.Jenis === 'Setor' ? 'in' : 'out'}">${t.Jenis === 'Setor' ? '+' : '−'}${rp(t.Jumlah)}</span></div>`).join('') + '</div>';
}

function render(d, pesan) {
  let h = `<div class="bar"><div><b>${esc(d.nama)}</b><div class="sub">${d.peran === 'Kepala' ? 'Kepala Sekolah' : d.peran === 'Wali' ? 'Wali Murid' : 'Guru'}</div></div>
    <button class="btn ghost" id="keluar">Keluar</button></div>`;

  if (d.peran === 'Wali') {
    const s = d.siswa[0] || {};
    h += `<div class="card"><div class="sub">Saldo ${esc(s.Nama)}</div><div class="saldo">${rp(d.total)}</div></div>
      <h2>Riwayat</h2>${riwayat(d.transaksi, false)}`;
  } else {
    h += `<div class="card"><div class="sub">Total tabungan ${d.siswa.length} siswa</div><div class="saldo">${rp(d.total)}</div></div>`;
    if (d.peran === 'Guru') {
      h += `<h2>Catat transaksi</h2><div class="card">
        <label for="fSiswa">Siswa</label><select id="fSiswa">${d.siswa.map(s => `<option value="${esc(s.ID)}">${esc(s.Nama)} (${esc(s.Kelas)})</option>`).join('')}</select>
        <div class="cols"><div><label for="fJenis">Jenis</label><select id="fJenis"><option>Setor</option><option>Tarik</option></select></div>
        <div><label for="fJumlah">Jumlah (Rp)</label><input id="fJumlah" type="number" min="1" inputmode="numeric"></div></div>
        <label for="fKet">Keterangan</label><input id="fKet" placeholder="Opsional">
        <p class="pesan ${pesan && pesan.err ? 'err' : 'ok'}" id="fPesan">${esc(pesan ? pesan.teks : '')}</p>
        <button class="btn aksi" id="fSimpan">Simpan transaksi</button></div>
        <details><summary>Tambah siswa baru</summary><div class="card" style="margin-top:10px">
        <label for="nNama">Nama siswa</label><input id="nNama">
        <label for="nKelas">Kelas</label><input id="nKelas">
        <p class="pesan" id="nPesan"></p>
        <button class="btn aksi" id="nSimpan">Tambah siswa</button></div></details>`;
    }
    h += `<h2>Saldo per siswa</h2><div class="card">${d.siswa.map(s => `
      <div class="row"><div><b>${esc(s.Nama)}</b><span class="sub">${esc(s.Kelas)}${s.PIN ? ' · ID ' + esc(s.ID) + ' · PIN ' + esc(s.PIN) : ''}</span></div>
      <b>${rp(s.Saldo)}</b></div>`).join('')}</div>
      <h2>Transaksi terakhir</h2>${riwayat(d.transaksi, true)}`;
  }
  $('#app').innerHTML = h;
  $('#keluar').onclick = keluar;

  if ($('#fSimpan')) $('#fSimpan').onclick = async () => {
    $('#fSimpan').disabled = true;
    const r = await call({ aksi: 'catat', ...S, id: $('#fSiswa').value, jenis: $('#fJenis').value, jumlah: $('#fJumlah').value, ket: $('#fKet').value });
    if (r.ok) muat({ teks: 'Transaksi tersimpan' });
    else { $('#fSimpan').disabled = false; $('#fPesan').className = 'pesan err'; $('#fPesan').textContent = r.pesan; }
  };
  if ($('#nSimpan')) $('#nSimpan').onclick = async () => {
    $('#nSimpan').disabled = true;
    const r = await call({ aksi: 'siswaBaru', ...S, nama: $('#nNama').value, kelas: $('#nKelas').value });
    if (r.ok) muat({ teks: 'Siswa ditambahkan: ID ' + r.id + ', PIN ' + r.pin });
    else { $('#nSimpan').disabled = false; $('#nPesan').className = 'pesan err'; $('#nPesan').textContent = r.pesan; }
  };
}
</script>
</body>
</html>
